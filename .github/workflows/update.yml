name: Update NSW GTFS
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every dataset in datasets.txt
        env:
          KEY: ${{ secrets.TFNSW_API_KEY }}
        run: |
          mkdir -p out
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            if echo "$url" | grep -q "api.transport.nsw.gov.au"; then
              ok=$(curl -sSfL --retry 3 -H "Authorization: apikey $KEY" -o "out/$name" "$url" && echo y)
            else
              ok=$(curl -sSfL --retry 3 -o "out/$name" "$url" && echo y)
            fi
            if [ "$ok" = "y" ]; then echo "OK   $name $(du -h "out/$name" | cut -f1)"
            else echo "FAIL $name"; rm -f "out/$name"; fi
          done < datasets.txt
          (date -u; ls -la out) > out/manifest.txt
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest -R ${{ github.repository }} || gh release create latest -R ${{ github.repository }} --title "Latest NSW GTFS" --notes "Auto-updated daily"
          gh release upload latest out/* --clobber -R ${{ github.repository }}
